<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScrumBoard - Project Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="theme-jira" data-theme="jira">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="logo-icon">S</div>
        <div class="logo-text" id="sidebar-logo-text">
          <div class="logo-project">ScrumBoard</div>
          <div class="logo-type">Software project</div>
        </div>
      </div>
      <button class="sidebar-toggle" id="sidebar-toggle" title="Collapse sidebar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6z"/>
        </svg>
      </button>
    </div>

    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" id="nav-board" role="tab" data-view="board">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
          <path d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z"/>
        </svg>
        <span class="nav-label">Board</span>
      </a>
      <a href="#" class="nav-item" id="nav-backlog" role="tab" data-view="backlog">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
          <path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/>
        </svg>
        <span class="nav-label">Backlog</span>
      </a>
      <a href="#" class="nav-item" id="nav-sprints" role="tab" data-view="sprints">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
          <path d="M11 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-8h-2v8H5V5h6V3zm7-2v5h5l-5-5z M19 13v2h-2v2h2v2h2v-2h2v-2h-2v-2h-2z"/>
        </svg>
        <span class="nav-label">Sprints</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-section-label">PROJECT SETTINGS</div>
      <a href="#" class="nav-item" id="nav-settings">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.6-.22l-2.39.96a7.06 7.06 0 00-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 00-.6.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.6.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.23.09.48 0 .6-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
        <span class="nav-label">Settings</span>
      </a>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="main-wrapper" id="main-wrapper">

    <!-- Top Toolbar -->
    <header class="toolbar">
      <div class="toolbar-left">
        <div class="breadcrumb">
          <span class="breadcrumb-project">ScrumBoard</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
          <span class="breadcrumb-page">Board</span>
        </div>
        <span class="sprint-banner" id="sprint-banner" style="display:none;"></span>
      </div>
      <div class="toolbar-center">
        <div class="search-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <input type="text" class="search-input" id="search-input" placeholder="Search issues..." />
          <button class="search-clear" id="search-clear" title="Clear search" aria-label="Clear search">&times;</button>
        </div>
        <div class="avatar-filter" id="avatar-filter" role="group" aria-label="Filter by team member"></div>
      </div>
      <div class="toolbar-right">
        <div class="filters">
          <select class="filter-select" id="filter-assignee" title="Filter by assignee">
            <option value="">Assignee</option>
          </select>
          <select class="filter-select" id="filter-priority" title="Filter by priority">
            <option value="">Priority</option>
            <option value="critical">Critical</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
          <select class="filter-select" id="filter-tag" title="Filter by tag">
            <option value="">Tag</option>
          </select>
          <select class="filter-select" id="filter-type" title="Filter by type">
            <option value="">Type</option>
            <option value="story">Story</option>
            <option value="bug">Bug</option>
            <option value="task">Task</option>
          </select>
          <button class="btn-clear-filters" id="btn-clear-filters" title="Clear all filters">Clear</button>
        </div>
        <div class="theme-picker" id="theme-picker" role="radiogroup" aria-label="Theme selector" title="Switch theme">
          <button class="theme-dot theme-dot-jira" id="theme-jira" data-theme="jira" role="radio" title="Jira Blue" aria-label="Jira Blue theme"></button>
          <button class="theme-dot theme-dot-dark" id="theme-dark" data-theme="dark" role="radio" title="Midnight Dark" aria-label="Midnight Dark theme"></button>
          <button class="theme-dot theme-dot-sand" id="theme-sand" data-theme="sand" role="radio" title="Sand" aria-label="Sand theme"></button>
        </div>
        <button class="btn-sm btn-primary btn-start-sprint" id="btn-start-sprint" title="Start sprint" style="display:none;">Start Sprint</button>
        <button class="btn-sm btn-warning btn-complete-sprint" id="btn-complete-sprint" title="Complete active sprint" style="display:none;" onclick="completeActiveSprint()">Complete Sprint</button>
      </div>
    </header>

    <!-- Board View -->
    <main class="board-container" id="board-container">
      <div class="board" id="board">

        <!-- To Do Column -->
        <div class="column" data-status="todo" id="col-todo">
          <div class="column-header">
            <div class="column-title">
              <span class="column-name">To Do</span>
              <span class="column-count" id="count-todo" aria-label="To Do count: 0">0</span>
            </div>
          </div>
          <div class="column-body" id="cards-todo" data-status="todo" role="listbox" aria-label="To Do tasks">
          </div>
          <div class="column-footer">
            <button class="btn-create-issue" id="create-issue-todo" data-status="todo" aria-label="Create issue in To Do">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
              Create Issue
            </button>
          </div>
        </div>

        <!-- In Progress Column -->
        <div class="column" data-status="inprogress" id="col-inprogress">
          <div class="column-header">
            <div class="column-title">
              <span class="column-name">In Progress</span>
              <span class="column-count" id="count-inprogress" aria-label="In Progress count: 0">0</span>
            </div>
          </div>
          <div class="column-body" id="cards-inprogress" data-status="inprogress" role="listbox" aria-label="In Progress tasks">
          </div>
          <div class="column-footer">
            <button class="btn-create-issue" id="create-issue-inprogress" data-status="inprogress" aria-label="Create issue in In Progress">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
              Create Issue
            </button>
          </div>
        </div>

        <!-- In Review Column -->
        <div class="column" data-status="inreview" id="col-inreview">
          <div class="column-header">
            <div class="column-title">
              <span class="column-name">In Review</span>
              <span class="column-count" id="count-inreview" aria-label="In Review count: 0">0</span>
            </div>
          </div>
          <div class="column-body" id="cards-inreview" data-status="inreview" role="listbox" aria-label="In Review tasks">
          </div>
          <div class="column-footer">
            <button class="btn-create-issue" id="create-issue-inreview" data-status="inreview" aria-label="Create issue in In Review">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
              Create Issue
            </button>
          </div>
        </div>

        <!-- Done Column -->
        <div class="column" data-status="done" id="col-done">
          <div class="column-header">
            <div class="column-title">
              <span class="column-name">Done</span>
              <span class="column-count" id="count-done" aria-label="Done count: 0">0</span>
            </div>
          </div>
          <div class="column-body" id="cards-done" data-status="done" role="listbox" aria-label="Done tasks">
          </div>
          <div class="column-footer">
            <button class="btn-create-issue" id="create-issue-done" data-status="done" aria-label="Create issue in Done">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
              Create Issue
            </button>
          </div>
        </div>

      </div>

      <!-- Backlog View (hidden by default) -->
      <div id="backlog-view" style="display:none;">
        <div class="backlog-header">
          <div class="backlog-header-left">
            <h2 class="backlog-title">Backlog</h2>
            <span class="column-count" id="backlog-count">0</span>
          </div>
          <button class="btn btn-primary btn-sm" id="backlog-create-btn">+ Create Issue</button>
        </div>
        <div id="backlog-list" class="backlog-list" role="list"></div>
      </div>

      <!-- Sprints View (hidden by default) -->
      <div id="sprints-view" style="display:none;">
        <div class="sprints-header">
          <h2 class="sprints-title">Sprints</h2>
          <button class="btn btn-primary btn-sm" id="sprints-create-btn">+ New Sprint</button>
        </div>
        <div id="sprints-list" class="sprints-list" role="list"></div>
      </div>

    </main>
  </div>

  <!-- Card Detail Modal -->
  <div class="modal-overlay" id="modal-overlay" style="display:none;">
    <div class="modal modal-wide" id="card-modal" role="dialog" aria-modal="true" aria-labelledby="modal-task-id">
      <div class="modal-header">
        <div class="modal-id" id="modal-task-id"></div>
        <button class="modal-close" id="modal-close" title="Close" aria-label="Close task detail">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-main">
          <div class="form-group">
            <label class="form-label">Title</label>
            <input type="text" class="form-input" id="modal-title" />
          </div>
          <div class="form-group">
            <label class="form-label">Description</label>
            <textarea class="form-textarea" id="modal-description" rows="4"></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Status</label>
              <select class="form-select" id="modal-status">
                <option value="todo">To Do</option>
                <option value="inprogress">In Progress</option>
                <option value="inreview">In Review</option>
                <option value="done">Done</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Type</label>
              <select class="form-select" id="modal-type">
                <option value="story">Story</option>
                <option value="bug">Bug</option>
                <option value="task">Task</option>
                <option value="subtask">Subtask</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Priority</label>
              <select class="form-select" id="modal-priority">
                <option value="critical">Critical</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Story Points</label>
              <select class="form-select" id="modal-story-points">
                <option value="0.5">0.5</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="5">5</option>
                <option value="8">8</option>
                <option value="13">13</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Assignee</label>
            <select class="form-select" id="modal-assignee"></select>
          </div>
          <div class="form-group">
            <label class="form-label">Tags</label>
            <div class="tags-checkbox-group" id="modal-tags"></div>
          </div>
          <div class="form-group">
            <label class="form-label">Sprint</label>
            <select class="form-select" id="modal-sprint">
              <option value="">Backlog (No Sprint)</option>
            </select>
          </div>

          <!-- Subtasks Section -->
          <div class="modal-section" id="modal-subtasks-section"></div>

          <!-- Issue Links Section -->
          <div class="modal-section" id="modal-links-section"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
        <button class="btn btn-primary" id="modal-save">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- Create Issue Modal -->
  <div class="modal-overlay" id="create-modal-overlay" style="display:none;">
    <div class="modal" id="create-modal" role="dialog" aria-modal="true" aria-label="Create Issue">
      <div class="modal-header">
        <h2 class="modal-title">Create Issue</h2>
        <button class="modal-close" id="create-modal-close" title="Close" aria-label="Close create issue modal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-main">
          <!-- Parent context (shown when creating subtask) -->
          <div class="form-group parent-context" id="create-parent-label" style="display:none;"></div>
          <input type="hidden" id="create-parent-id" value="" />

          <div class="form-group">
            <label class="form-label">Title <span class="required">*</span></label>
            <input type="text" class="form-input" id="create-title" placeholder="Enter issue title" />
            <div class="form-error" id="create-title-error" style="display:none;">Title is required</div>
          </div>
          <div class="form-group">
            <label class="form-label">Description</label>
            <textarea class="form-textarea" id="create-description" rows="3" placeholder="Describe the issue..."></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Type</label>
              <select class="form-select" id="create-type">
                <option value="task">Task</option>
                <option value="story">Story</option>
                <option value="bug">Bug</option>
                <option value="subtask">Subtask</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Status</label>
              <select class="form-select" id="create-status">
                <option value="todo">To Do</option>
                <option value="inprogress">In Progress</option>
                <option value="inreview">In Review</option>
                <option value="done">Done</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Priority</label>
              <select class="form-select" id="create-priority">
                <option value="medium">Medium</option>
                <option value="critical">Critical</option>
                <option value="high">High</option>
                <option value="low">Low</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Story Points</label>
              <select class="form-select" id="create-story-points">
                <option value="0.5">0.5</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="5">5</option>
                <option value="8">8</option>
                <option value="13">13</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Assignee</label>
            <select class="form-select" id="create-assignee">
              <option value="">Unassigned</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Tags</label>
            <div class="tags-checkbox-group" id="create-tags"></div>
          </div>
          <div class="form-group">
            <label class="form-label">Sprint</label>
            <select class="form-select" id="create-sprint">
              <option value="">Backlog (No Sprint)</option>
            </select>
          </div>

          <!-- Linked Issues section -->
          <div class="modal-section" id="create-links-section">
            <div class="form-label">Linked Issues</div>
            <div id="create-links-list" role="list">
              <p class="empty-hint">No linked issues.</p>
            </div>
            <div class="add-link-form">
              <select id="create-link-target-select" class="form-select link-select" aria-label="Select target issue">
                <option value="">— Select issue —</option>
              </select>
              <select id="create-link-type-select" class="form-select link-type-select" aria-label="Select link type">
                <option value="blocks">blocks</option>
                <option value="isBlockedBy">is blocked by</option>
                <option value="duplicates">duplicates</option>
                <option value="relatesTo">relates to</option>
              </select>
              <button type="button" class="btn-sm btn-outline" id="create-add-link-btn">+ Add Link</button>
            </div>
          </div>

          <!-- Subtasks section -->
          <div class="modal-section" id="create-subtasks-section">
            <div class="form-label">Subtasks</div>
            <div id="create-subtasks-list" role="list">
              <p class="empty-hint">No subtasks.</p>
            </div>
            <div class="add-link-form">
              <input type="text" class="form-input" id="create-subtask-title-input" placeholder="Subtask title" style="flex:1;" />
              <button type="button" class="btn-sm btn-outline" id="create-add-subtask-btn">+ Add Subtask</button>
            </div>
          </div>

        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="create-cancel">Cancel</button>
        <button class="btn btn-primary" id="create-submit">Create Issue</button>
      </div>
    </div>
  </div>

  <!-- Sprint Management Modal -->
  <div class="modal-overlay" id="sprint-modal-overlay" style="display:none;">
    <div class="modal modal-wide" id="sprint-modal" role="dialog" aria-modal="true" aria-label="Sprint Management">
      <div class="modal-header">
        <h2 class="modal-title">Sprint Management</h2>
        <button class="modal-close" id="sprint-modal-close" title="Close" aria-label="Close sprint management">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-main">

          <!-- Existing sprints list -->
          <div class="form-group">
            <label class="form-label">Sprints</label>
            <div id="sprint-list" role="list"></div>
          </div>

          <!-- Create new sprint form -->
          <div class="sprint-create-section">
            <div class="form-label sprint-create-label">Create New Sprint</div>
            <div class="form-group">
              <input type="text" class="form-input" id="new-sprint-name" placeholder="Sprint name (e.g. Sprint 4)" />
            </div>
            <div class="form-group">
              <textarea class="form-textarea" id="new-sprint-goal" rows="2" placeholder="Sprint goal (optional)"></textarea>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Start Date</label>
                <input type="date" class="form-input" id="new-sprint-start" />
              </div>
              <div class="form-group">
                <label class="form-label">End Date</label>
                <input type="date" class="form-input" id="new-sprint-end" />
              </div>
            </div>
            <button class="btn btn-primary" id="btn-create-sprint">Create Sprint</button>
          </div>

        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="sprint-modal-close-footer" onclick="closeSprintModal()">Close</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
