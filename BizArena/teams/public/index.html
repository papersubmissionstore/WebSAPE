<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microsoft Teams</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <!-- Title Bar with centered search -->
    <div class="title-bar">
      <div class="title-bar-left"></div>
      <div class="search-container">
        <div class="search-input-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="search-input" placeholder="Search" autocomplete="off">
          <button class="search-clear-btn" id="search-clear-btn" style="display:none" title="Clear search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>
      <div class="title-bar-right"></div>
    </div>

    <!-- Main content row -->
    <div class="app-body">
      <!-- Icon Rail -->
      <div class="icon-rail">
      <div class="icon-rail-top">
        <div class="user-avatar" id="my-avatar" title="Alex Rivera">AR</div>
      </div>
      <div class="icon-rail-nav">
        <button class="nav-btn active" id="nav-chat" data-view="chat" title="Chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>Chat</span>
        </button>
        <button class="nav-btn" id="nav-teams" data-view="teams" title="Teams">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span>Teams</span>
        </button>
        <button class="nav-btn" id="nav-calendar" data-view="calendar" title="Calendar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <span>Calendar</span>
        </button>
        <button class="nav-btn" id="nav-calls" data-view="calls" title="Calls">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13 19.79 19.79 0 0 1 1.6 4.38 2 2 0 0 1 3.57 2.18h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6.05 6.05l1.09-1.09a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
          </svg>
          <span>Calls</span>
        </button>
        <button class="nav-btn" id="nav-files" data-view="files" title="Files">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
            <polyline points="13 2 13 9 20 9"></polyline>
          </svg>
          <span>Files</span>
        </button>
      </div>
    </div>

    <!-- Chat List Panel -->
    <div class="chat-list-panel">
      <div class="chat-list-header">
        <h2>Chat</h2>
        <button class="new-chat-btn" id="new-chat-btn" title="New chat" aria-label="New chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>

      <div id="conv-list-container">
        <!-- Favorites section -->
        <div class="conv-section" id="favorites-section">
          <div class="conv-section-header">
            <span class="section-toggle">&#9660;</span>
            <span>Favorites</span>
          </div>
          <div class="conv-section-body" id="favorites-list" role="listbox" aria-label="Favorites"></div>
        </div>

        <!-- Recent section -->
        <div class="conv-section" id="recent-section">
          <div class="conv-section-header">
            <span class="section-toggle">&#9660;</span>
            <span>Recent</span>
          </div>
          <div class="conv-section-body" id="recent-list" role="listbox" aria-label="Recent chats"></div>
        </div>

        <!-- Search results section (hidden by default) -->
        <div class="conv-section" id="search-results-section" style="display:none">
          <div class="conv-section-header">
            <span>Search Results</span>
          </div>
          <div class="conv-section-body" id="search-results-list" role="listbox" aria-label="Search results"></div>
        </div>
      </div>
    </div>

    <!-- Chat Main Area -->
    <div class="chat-main">
      <div class="chat-welcome" id="chat-welcome">
        <div class="welcome-content">
          <div class="welcome-icon">💬</div>
          <h3>Select a conversation</h3>
          <p>Choose a chat from the list to start messaging</p>
        </div>
      </div>

      <div class="chat-active" id="chat-active" style="display:none">
        <div class="chat-header" id="chat-header">
          <div class="chat-header-info">
            <div class="chat-header-avatar" id="chat-header-avatar"></div>
            <div class="chat-header-text">
              <div class="chat-header-name" id="chat-header-name"></div>
              <div class="chat-header-sub" id="chat-header-sub"></div>
            </div>
          </div>
          <div class="chat-header-actions">
            <button class="header-action-btn favorite-btn" id="favorite-btn" title="Toggle favorite">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
              </svg>
            </button>
            <button class="header-action-btn" id="mute-btn" title="Mute notifications">
              <span class="mute-label">🔇</span>
            </button>
          </div>
        </div>

        <div class="message-list" id="message-list" role="list"></div>

        <div class="message-input-area">
          <div id="reply-bar" class="reply-bar" style="display:none">
            <span id="reply-bar-text" class="reply-bar-text"></span>
            <button id="reply-cancel-btn" class="reply-cancel-btn" title="Cancel reply">✕</button>
          </div>

          <!-- Emoji picker panel (floating) -->
          <div id="emoji-panel" class="emoji-input-panel" role="toolbar" aria-label="Emoji picker" style="display:none"></div>

          <div class="message-input-box">
            <!-- Format toolbar (inside box, above textarea, hidden by default) -->
            <div id="format-bar" class="format-bar" role="toolbar" aria-label="Text formatting" style="display:none">
              <button id="fmt-bold" class="fmt-btn" title="Bold" aria-label="Bold"><b>B</b></button>
              <button id="fmt-italic" class="fmt-btn fmt-italic-btn" title="Italic" aria-label="Italic"><i>I</i></button>
              <button id="fmt-underline" class="fmt-btn fmt-underline-btn" title="Underline" aria-label="Underline">U</button>
              <button id="fmt-strike" class="fmt-btn" title="Strikethrough" aria-label="Strikethrough">
                <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                  <line x1="2" y1="8" x2="14" y2="8"/>
                  <path d="M5 5a3 3 0 0 1 6 0c0 1-.5 1.5-1 2"/>
                  <path d="M5 11a3 3 0 0 0 6 0"/>
                </svg>
              </button>
            </div>

            <div class="message-input-wrapper">
              <div
                id="message-input"
                class="message-input-editor"
                contenteditable="true"
                role="textbox"
                aria-label="Type a message"
                aria-multiline="true"
                data-placeholder="Type a message"
              ></div>
            </div>

            <div class="message-input-footer">
              <div class="message-input-toolbar">
                <!-- Format toggle (Aa) -->
                <button id="toolbar-format" class="toolbar-btn" title="Formatting options" aria-label="Formatting options">
                  <svg viewBox="0 0 20 20" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <text x="1" y="15" font-size="13" font-weight="700" font-family="Segoe UI,sans-serif" fill="currentColor">A</text>
                    <text x="11" y="15" font-size="9" font-family="Segoe UI,sans-serif" fill="currentColor">a</text>
                    <line x1="1" y1="18" x2="19" y2="18" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                  </svg>
                </button>
                <!-- Emoji -->
                <button id="toolbar-emoji" class="toolbar-btn" title="Emoji" aria-label="Emoji">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
                    <line x1="9" y1="9" x2="9.01" y2="9" stroke-width="3"/>
                    <line x1="15" y1="9" x2="15.01" y2="9" stroke-width="3"/>
                  </svg>
                </button>
                <!-- Attach -->
                <button id="toolbar-attach" class="toolbar-btn" title="Attach file" aria-label="Attach file">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                  </svg>
                </button>
              </div>
              <div class="input-hint" id="input-hint" style="display:none">
                <span>Press <kbd>Shift</kbd>+<kbd>Enter</kbd> for new line</span>
              </div>
              <button id="send-btn" class="send-btn" aria-label="Send message" disabled>
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    </div><!-- /.app-body -->
  </div><!-- /.app-shell -->

  <div id="toast-container" class="toast-container"></div>
  <script src="app.js"></script>
</body>
</html>
